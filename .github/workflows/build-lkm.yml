name: KernelSU LKM

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: AOSPA Marble kernel and device source branch
        required: true
        type: choice
        default: calcite
        options:
          - calcite
          - beryl
          - vauxite
      ksu_variant:
        description: KernelSU variant to build as LKM
        required: true
        type: choice
        default: KernelSU-Official
        options:
          - KernelSU-Official
          - KOWX712
          - BakaSU
          - SukiSU-Ultra
          - KernelSU-Next

permissions:
  contents: read

concurrency:
  group: aospa-marble-kernelsu-lkm-${{ inputs.source_branch }}-${{ inputs.ksu_variant }}
  cancel-in-progress: false

env:
  CLANG_DIR: clang-r596125
  NOMOUNT_REPO: maxsteeel/nomount
  BUILD_TYPE: kernelsu-lkm

jobs:
  build-ksu-lkm:
    name: Build ${{ inputs.ksu_variant }} LKM
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout builder
        uses: actions/checkout@v7.0.1

      - name: Setup AOSPA build environment
        uses: ./.github/actions/setup-build
        with:
          clang-dir: ${{ env.CLANG_DIR }}
          source-branch: ${{ inputs.source_branch }}

      - name: Resolve KernelSU variant
        id: ksu
        shell: bash
        env:
          KSU_VARIANT: ${{ inputs.ksu_variant }}
        run: |
          set -euo pipefail
          case "$KSU_VARIANT" in
            KernelSU-Official)
              echo "repo=tiann/KernelSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;
            KOWX712)
              echo "repo=KOWX712/KernelSU" >> "$GITHUB_OUTPUT"
              echo "branch=master" >> "$GITHUB_OUTPUT"
              ;;
            BakaSU)
              echo "repo=Baka-SU/BakaSU" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;
            SukiSU-Ultra)
              echo "repo=SukiSU-Ultra/SukiSU-Ultra" >> "$GITHUB_OUTPUT"
              echo "branch=main" >> "$GITHUB_OUTPUT"
              ;;
            KernelSU-Next)
              echo "repo=KernelSU-Next/KernelSU-Next" >> "$GITHUB_OUTPUT"
              echo "branch=dev" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported KernelSU variant: $KSU_VARIANT" >&2
              exit 1
              ;;
          esac

      - name: Include selected KernelSU variant
        shell: bash
        env:
          KSU_REPO: ${{ steps.ksu.outputs.repo }}
          KSU_BRANCH: ${{ steps.ksu.outputs.branch }}
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450

          # AOSPA source may already contain a detached/stale KernelSU checkout.
          # The upstream setup script reuses any existing directory and then runs
          # git pull, which fails when that checkout has no attached branch.
          if [[ "${KSU_REPO}" == "tiann/KernelSU" ]]; then
            rm -rf KernelSU
          fi

          # Always build the latest branch head (no commit/tag pin).
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/${KSU_REPO}/${KSU_BRANCH}/kernel/setup.sh" \
            -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${KSU_BRANCH}"

          KSU_DIR=""
          for d in KernelSU KernelSU-Next; do
            if [ -d "$d/kernel" ]; then KSU_DIR="$d"; break; fi
          done
          test -n "$KSU_DIR"

          # Record the commit that was resolved, for build-info.txt.
          KSU_REF="$(git -C "$KSU_DIR" rev-parse HEAD)"
          echo "KSU_REF=${KSU_REF}" >> "$GITHUB_ENV"
          echo "Selected ${KSU_REPO} @ ${KSU_BRANCH} (${KSU_REF})"

      - name: Include latest NoMount
        shell: bash
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          curl --fail --location --retry 5 --retry-all-errors \
            "https://raw.githubusercontent.com/${NOMOUNT_REPO}/HEAD/kernel/setup.sh" \
            | bash -s
          NOMOUNT_REF="$(git -C NoMount rev-parse HEAD)"
          echo "NOMOUNT_REF=${NOMOUNT_REF}" >> "$GITHUB_ENV"
          echo "Selected ${NOMOUNT_REPO} @ ${NOMOUNT_REF}"

      - name: Build KernelSU and NoMount LKM
        shell: bash
        env:
          KSU_REPO: ${{ steps.ksu.outputs.repo }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
        run: |
          set -euo pipefail
          cd kernel_platform/xiaomi/sm8450
          export PATH="$(realpath ../../clang/${CLANG_DIR}/bin):$PATH"
          ./build.sh marble --only-modules
          grep -q '^CONFIG_KSU=m$' out/.config
          grep -q '^CONFIG_NOMOUNT=m$' out/.config
          test -s out/kernelsu.ko
          test -s out/nomount.ko
          file out/kernelsu.ko out/nomount.ko

      - name: Generate build metadata
        shell: bash
        env:
          KSU_REPO: ${{ steps.ksu.outputs.repo }}
          KSU_VARIANT: ${{ inputs.ksu_variant }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          bash scripts/write-build-info.sh
          grep -q "KernelSU ref: ${KSU_REF}" build-info.txt

      - name: Upload KernelSU LKM artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kernelsu-lkm-${{ inputs.ksu_variant }}
          path: |
            kernel_platform/xiaomi/sm8450/out/kernelsu.ko
            kernel_platform/xiaomi/sm8450/out/nomount.ko
            build-info.txt
            resolved-manifest.xml
          if-no-files-found: error
          compression-level: 9
          retention-days: 14
